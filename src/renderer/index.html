<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:;">
  <title>XenoMenu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="xeno-window">
    <!-- Decorative outer frame inspired by Xenogears menu windows -->
    <div class="frame-outer">
      <div class="frame-inner">
        <!-- Title / Header -->
        <header class="menu-header">
          <div class="header-ornament left"></div>
          <h1 class="title">XENOMENU</h1>
          <div class="header-ornament right"></div>
          <button id="btn-close" class="window-btn" title="Hide (Esc)">✕</button>
        </header>

        <main class="menu-body">
          <!-- Left: Command list (like main menu options) -->
          <nav class="command-list" id="command-list" role="menu" aria-label="Main commands">
            <div class="list-header">COMMAND</div>
            <ul id="menu-items">
              <!-- Populated by JS -->
            </ul>
          </nav>

          <!-- Right: Party / System Status (inspired by character status panel) -->
          <section class="status-panel" id="status-panel" aria-label="System status">
            <div class="list-header">STATUS</div>
            <div id="party-status" class="party-status">
              <!-- Dynamic status cards -->
            </div>
          </section>
        </main>

        <!-- Footer: G (resources) + Time -->
        <footer class="menu-footer">
          <div class="footer-item gold">
            <span class="label">FREE</span>
            <span id="footer-free" class="value">-- GB</span>
          </div>
          <div class="footer-item time">
            <span class="label">TIME</span>
            <span id="footer-time" class="value">00:00:00</span>
          </div>
          <div class="footer-item os">
            <span id="footer-os" class="value small">--</span>
          </div>
        </footer>

        <!-- Cursor / Selection indicator (red triangle style) -->
        <div id="cursor" class="cursor" aria-hidden="true">▶</div>
      </div>
    </div>

    <!-- Detail / Sub-menu overlay -->
    <div id="detail-overlay" class="detail-overlay hidden">
      <div class="detail-frame">
        <div class="detail-header">
          <span id="detail-title">DETAIL</span>
          <button id="detail-close" class="window-btn">◀ BACK</button>
        </div>
        <div id="detail-content" class="detail-content"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
